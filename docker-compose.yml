services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cydra_social
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_cydra:/var/lib/postgresql/data

volumes:
  postgres_data_cydra:
